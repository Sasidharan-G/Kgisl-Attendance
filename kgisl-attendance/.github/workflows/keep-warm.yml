# Render's free plan puts the service to sleep after ~15 minutes without traffic and Neon suspends an idle database
# after ~5 minutes; the first request after that waits tens of seconds. This pings the readiness endpoint (it runs a
# real database query) so both stay awake while the app is being used for demos and classes.
name: keep-warm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping readiness endpoint
        run: curl --silent --show-error --max-time 60 --retry 2 --retry-delay 10 https://kgisl-attendance.onrender.com/health/ready
