services:
  - type: web
    name: Kgisl-Attendance
    env: docker
    rootDir: kgisl-attendance
    branch: main
    autoDeployTrigger: checksPass
    plan: free
    region: oregon
    healthCheckPath: /health/ready
    envVars:
      # Neon PostgreSQL (Singapore). Paste the direct (non-pooled) URL in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: kgisl-attendance-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        sync: false
      - key: BEACON_TOKEN_PEPPER
        generateValue: true
      - key: BEACON_HMAC_SECRET
        sync: false
      - key: WEBAUTHN_RP_ID
        value: kgisl-attendance.onrender.com
      - key: BEACON_TOKEN_TTL_SECONDS
        value: "30"
      - key: FRONTEND_ORIGINS
        value: "https://kgisl-attendance.onrender.com"
      - key: NODE_ENV
        value: production
      - key: QR_REFRESH_INTERVAL_SECONDS
        value: "10"
      - key: MAX_GPS_ACCURACY_METERS
        value: "50"
      - key: DEFAULT_GEOFENCE_RADIUS_M
        value: "120"
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: PASSWORD_RESET_TTL_SECONDS
        value: "600"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: "25mca95@kgisliim.ac.in"
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: redis
    name: kgisl-attendance-redis
    plan: free
    region: oregon
    ipAllowList: []
